<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Neostats.si is for sale</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500&family=Michroma&display=swap" rel="stylesheet">
<style>
  :root {
    --accent: #000000;
    --ink: #000000;
    --muted: #6b6b6b;
    --line: #e6e6e6;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *, *::before, *::after { box-sizing: inherit; }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    min-height: 100%;
    margin: 0;
    background: #ffffff;
    color: var(--ink);
    font-family: "Manrope", "Helvetica Neue", Arial, sans-serif;
    overflow-x: hidden;
    position: relative;
  }
  /* soft green ring, the only decoration */
  .ring {
    position: absolute;
    right: -18vmax; top: -18vmax;
    width: 56vmax; height: 56vmax;
    border-radius: 50%;
    border: 1px solid var(--green);
    opacity: .35;
    pointer-events: none;
  }
  .ring::after {
    content: ""; position: absolute; inset: 7vmax;
    border-radius: 50%; border: 1px solid var(--green); opacity: .6;
  }
  main {
    position: relative;
    min-height: 100vh;
    max-width: 1100px;
    margin: 0 auto;
    padding: clamp(28px, 6vw, 72px);
    display: flex; flex-direction: column; justify-content: center;
  }
  h1 {
    margin: 0;
    color: var(--ink);
    font-family: "Michroma", "Arial Black", Arial, sans-serif;
    font-weight: 400;
    font-size: clamp(1.5rem, 7.6vw, 5.75rem);
    line-height: 1.1;
    letter-spacing: -0.01em;
    overflow: hidden;
    padding-bottom: .1em;
    white-space: nowrap;
  }
  h1 .neo { color: var(--accent); }
  h1 > span { display: inline-block; animation: rise .9s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes rise { from { transform: translateY(105%); } to { transform: none; } }
  .sale {
    margin: clamp(12px, 2vw, 24px) 0 clamp(40px, 7vw, 88px);
    font-size: clamp(1.4rem, 4vw, 2.5rem);
    font-weight: 300;
    letter-spacing: -0.02em;
  }
  .contact { max-width: 720px; border-top: 1px solid var(--ink); }
  .row {
    display: flex; align-items: baseline; justify-content: space-between; gap: 16px;
    padding: 22px 4px;
    border-bottom: 1px solid var(--line);
    color: var(--ink); text-decoration: none;
    transition: padding .25s ease, background-color .25s ease;
  }
  .row small { color: var(--muted); font-size: .95rem; font-weight: 400; flex: none; }
  .row b {
    font-weight: 500; font-size: clamp(1.05rem, 3.4vw, 1.75rem);
    letter-spacing: -0.01em; overflow-wrap: anywhere; text-align: right;
  }
  .row:hover { padding-left: 18px; padding-right: 18px; background: #f6fbf2; }
  .row:focus-visible { outline: 3px solid var(--green); outline-offset: -3px; }
  @media (max-width: 520px) {
    .row { flex-direction: column; align-items: flex-start; gap: 4px; }
    .row b { text-align: left; }
  }
  @media (prefers-reduced-motion: reduce) {
    h1 span { animation: none; }
    .row { transition: none; }
  }
</style>
</head>
<body>
  <div class="ring" aria-hidden="true"></div>
  <main>
    <h1 aria-label="Neostats.si"><span><span class="neo">Neo</span>stats.si</span></h1>
    <p class="sale">Domain name available for acquisition.</p>
    <div class="contact">
      <a class="row" href="tel:+919821921465">
        <small>Call</small><b>+91-9821921465</b>
      </a>
    </div>
  </main>
</body>
</html>
